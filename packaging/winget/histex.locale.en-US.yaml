ShortDescription: Fuzzy-search, explain and save your shell history (Windows-first, fzf-powered)
Description: histex reads your PowerShell or shell history, drops duplicates and noise, opens an fzf picker, explains the selected command (local cache, PowerShell Get-Help, tldr, cheat.sh) and saves the useful ones as Markdown recipes, a JSONL log or runnable scripts. The Windows release ships fzf with it, so nothing else has to be installed.
