name: self-test

on:
  push:
  pull_request:

jobs:
  self-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: vet
        run: go vet ./...
      - name: compile
        run: go build ./...
      - name: offline self-test
        run: go run . --self-test
