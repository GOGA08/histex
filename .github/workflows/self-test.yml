name: self-test

on:
  push:
  pull_request:

jobs:
  self-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
          echo "all Go files are formatted"
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: unit tests
        run: go test ./...
      - name: build the binary once
        run: go build -o histex.exe -trimpath .
      - name: offline self-test on that artifact (not a rebuild)
        run: ./histex.exe --self-test
