name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build histex.exe (version taken from the tag)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          go build -o histex.exe -trimpath -ldflags "-s -w -X main.version=$version" .
      - name: self-test the binary that is about to be shipped
        run: .\histex.exe --self-test
      - name: check that the reported version matches the tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $reported = (.\histex.exe --version).Trim().Split(" ")[1]
          if ($reported -ne $version) {
            throw "histex.exe reports $reported but the tag is $version"
          }
          Write-Output "[ok] histex.exe reports $reported"
      - name: publish the release and attach histex.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "histex $tag" --generate-notes
          }
          gh release upload $tag histex.exe --clobber
