name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            builds: "histex.exe:windows:amd64"
            native: histex.exe
            artifacts: histex.exe
          - os: ubuntu-latest
            builds: "histex-linux-amd64:linux:amd64 histex-linux-arm64:linux:arm64"
            native: histex-linux-amd64
            artifacts: |
              histex-linux-amd64
              histex-linux-arm64
          - os: macos-latest
            builds: "histex-darwin-arm64:darwin:arm64 histex-darwin-amd64:darwin:amd64"
            native: histex-darwin-arm64
            artifacts: |
              histex-darwin-arm64
              histex-darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: build the binaries for this runner (version from the tag)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $flags = "-s -w -X main.version=$version"
          foreach ($spec in "${{ matrix.builds }}".Split(" ")) {
            $output, $goos, $goarch = $spec.Split(":")
            $env:GOOS = $goos
            $env:GOARCH = $goarch
            go build -trimpath -ldflags $flags -o $output .
            if ($LASTEXITCODE -ne 0) { throw "go build failed for $spec" }
            Write-Output "[ok] built $output ($goos/$goarch)"
          }
      - name: self-test and version check on the native binary
        shell: pwsh
        run: |
          $native = "${{ matrix.native }}"
          $exe = if ("${{ runner.os }}" -eq "Windows") { ".\$native" } else { "./$native" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed for $native" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          $reported = (& $exe --version).Trim().Split(" ")[1]
          if ($reported -ne $version) {
            throw "$native reports $reported but the tag is $version"
          }
          Write-Output "[ok] $native reports $reported"
      # --- optional SignPath code signing (Windows exe only) -----------------
      # Dormant until the repo secrets are set: SIGNPATH_API_TOKEN,
      # SIGNPATH_ORG_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG.
      # Apply for free OSS signing at signpath.io, install the SignPath GitHub
      # App on this repo, link the repo to the project, then add the secrets.
      # While the secrets are missing every release ships unsigned as before.
      - name: check for signpath signing credentials
        id: signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $ok = $env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORG_ID -and $env:SIGNPATH_PROJECT_SLUG -and $env:SIGNPATH_SIGNING_POLICY_SLUG
          if ($ok) { "present=true" >> $env:GITHUB_OUTPUT; Write-Output "[ok] signpath signing enabled" }
          else { "present=false" >> $env:GITHUB_OUTPUT; Write-Output "[skip] signpath secrets not set - this build ships unsigned" }
      - name: upload the unsigned exe for signing
        if: steps.signpath.outputs.present == 'true' && runner.os == 'Windows'
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-histex-windows
          path: histex.exe
      - name: sign the exe with signpath
        if: steps.signpath.outputs.present == 'true' && runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-histex
      - name: replace the exe with the signed one
        if: steps.signpath.outputs.present == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $signed = "signed-histex\histex.exe"
          if (-not (Test-Path $signed)) { throw "signpath reported success but $signed is missing" }
          Copy-Item $signed histex.exe -Force
          Write-Output "[ok] histex.exe replaced with the signed build"
      # -------------------------------------------------------------------------
      - uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: fetch fzf so the Windows download needs no separate install
        run: |
          set -euo pipefail
          fzfVersion=0.74.4
          base="https://github.com/junegunn/fzf/releases/download/v$fzfVersion"
          curl -sSL -o /tmp/fzf.zip "$base/fzf-$fzfVersion-windows_amd64.zip"
          unzip -o -q /tmp/fzf.zip -d dist
          curl -sSL -o dist/fzf-LICENSE.txt \
            "https://raw.githubusercontent.com/junegunn/fzf/v$fzfVersion/LICENSE"
          test -s dist/fzf.exe
          test -s dist/fzf-LICENSE.txt
          ls -l dist
      - name: checksums for every asset
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          # --repo: this job has no checkout, so gh cannot infer the repository
          gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$REPO" --title "histex $tag" --generate-notes
          gh release upload "$tag" dist/* --repo "$REPO" --clobber
